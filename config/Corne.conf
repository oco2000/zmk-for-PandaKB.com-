# Battery level reporting interval, in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# More debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# Raise BLE radio transmit power, to fix latency and poor left-right comms
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Change the keyboard's default display name
CONFIG_ZMK_KEYBOARD_NAME="Oleh_Corne"
# Works around a Windows bug in battery reporting
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Sleep
# Milliseconds of inactivity before entering idle state	(60 sec)
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Enable deep sleep support	
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (10 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# ZMK Studio is disabled: the keymap is only ever edited in these files, so the
# per-key RGB compile-time tables are guaranteed to match the running keymap.
CONFIG_ZMK_STUDIO=n

# RGB: use this repository's per-key RGB, disable ZMK's own whole-strip underglow
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_PERKEY_RGB=y
CONFIG_ZMK_PERKEY_RGB_BRT_MAX=60
# Lights off by default; turn them on with &prgb PRGB_TOG on the SYS layer
CONFIG_ZMK_PERKEY_RGB_ON_START=n
# Turn the RGB off when the keyboard goes idle
CONFIG_ZMK_PERKEY_RGB_AUTO_OFF_IDLE=y

# Diagnostic: walk a single lit LED along the strip to confirm LED order and count
# CONFIG_ZMK_PERKEY_RGB_CHASE=y

# Enable the central side to pull the peripheral's battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable the central side to proxy the peripheral's battery status to your computer/host OS
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# disable animation on peripheral
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n

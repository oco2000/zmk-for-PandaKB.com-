# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 增加键盘的 BLE 无线电的发射功率，用解决延迟和左右通讯不佳的问题
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Oleh_Corne"
# 用于解决 Windows 中与电池报告相关的错误
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# oled相关配置
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

#休眠相关配置
# Milliseconds of inactivity before entering idle state	(60 sec)
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Enable deep sleep support	
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (5 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# zmk studio 已停用：键盘映射只在文件里编辑，
# 这样每键 RGB 的编译期表一定和实际运行的 keymap 一致。
CONFIG_ZMK_STUDIO=n

#rgb相关配置：使用本仓库的每键 RGB，停用 ZMK 自带的整条灯带 underglow
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_PERKEY_RGB=y
CONFIG_ZMK_PERKEY_RGB_BRT_MAX=60
CONFIG_ZMK_PERKEY_RGB_ON_START=y
#键盘进入空闲状态时关闭RGB
CONFIG_ZMK_PERKEY_RGB_AUTO_OFF_IDLE=y

# 诊断：让一颗灯沿灯带走一遍，用来确认 LED 顺序和数量
CONFIG_ZMK_PERKEY_RGB_CHASE=y

# Enable the central side to pull the peripheral's battery level
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable the central side to proxy the peripheral's battery status to your computer/host OS
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# disable animation on peripheral
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n

